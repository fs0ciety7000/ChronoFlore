server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # text/html is always compressed once gzip is on (listing it only warns).
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml model/gltf-binary application/octet-stream application/wasm;

  # Security headers. A location with its own add_header drops every header
  # inherited from here, so each such location below repeats these two lines.
  # No HSTS: TLS is terminated by Traefik (Coolify).
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Fingerprinted build assets and versioned 3D models: cache for a year.
  location ^~ /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
  }

  # The manifest maps model ids to their versioned file names: revalidate it.
  location = /models/polyfork/manifest.json {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
  }

  # {id}.{sha8}.glb files never change once deployed.
  location ^~ /models/ {
    types {
      model/gltf-binary glb;
      application/json json;
    }
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
  }

  # The game's Web export (npm run fetch:game). Godot file names are not
  # fingerprinted (index.js, index.wasm, index.pck...), so everything here is
  # revalidated (ETag) on each load. No COOP/COEP: the export is built without
  # thread support, so it needs no SharedArrayBuffer.
  location ^~ /jouer/ {
    types {
      application/wasm wasm;
      application/javascript js;
      text/html html;
      application/octet-stream pck;
      image/png png;
    }
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri $uri/ =404;
  }

  # Desktop builds (npm run fetch:downloads). File names are not versioned,
  # so they are revalidated (ETag) on each request. Already compressed or
  # binary: no gzip. Always downloaded, never displayed.
  location = /telecharger/manifest.json {
    types { application/json json; }
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
  }

  location ^~ /telecharger/ {
    gzip off;
    types {
      application/x-apple-diskimage dmg;
      application/vnd.debian.binary-package deb;
      application/octet-stream exe;
      application/gzip gz;
    }
    default_type application/octet-stream;
    add_header Content-Disposition "attachment";
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
  }

  # HTML must always be revalidated so new deploys show up immediately.
  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  location ~* \.html$ {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # Other static files (favicon, og image, fonts outside /_astro): short cache.
  location ~* \.(css|js|png|jpg|webp|svg|ico|woff2|mp4|glb)$ {
    add_header Cache-Control "public, max-age=86400";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }
}
