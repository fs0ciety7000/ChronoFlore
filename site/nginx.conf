server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Fingerprinted build assets and versioned 3D models: cache for a year.
  location ^~ /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location ^~ /models/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # HTML must always be revalidated so new deploys show up immediately.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  location ~* \.html$ {
    add_header Cache-Control "no-cache";
  }

  # Other static files (favicon, og image, fonts outside /_astro): short cache.
  location ~* \.(css|js|png|jpg|webp|svg|ico|woff2|mp4|glb)$ {
    add_header Cache-Control "public, max-age=86400";
  }
}
