<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>ChronoFlore — pistes de logo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&amp;family=Nunito:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7a5c8f}a:hover{color:#4f3a60}
</style>
</helmet>
<div style="width: 1440px; height: 640px; box-sizing: border-box; padding: 56px; background: {{ground}}; font-family: 'Nunito', sans-serif; color: #3b3350; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 40px">

<div style="background: #fffdf8; border-radius: 28px; padding: 40px 32px; display: flex; flex-direction: column; align-items: center; gap: 20px; box-shadow: 0 10px 30px rgba(90, 70, 120, 0.08)">
<p style="margin: 0; align-self: flex-start; font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #6f6585">A · Fleur-horloge</p>
<svg width="220" height="220" viewBox="0 0 200 200" role="img" aria-label="Fleur dont les pétales forment un cadran d'horloge">
<g fill="#f4b9c8">
<ellipse cx="100" cy="46" rx="15" ry="28" transform="rotate(0 100 100)"></ellipse>
<ellipse cx="100" cy="46" rx="15" ry="28" transform="rotate(60 100 100)"></ellipse>
<ellipse cx="100" cy="46" rx="15" ry="28" transform="rotate(120 100 100)"></ellipse>
<ellipse cx="100" cy="46" rx="15" ry="28" transform="rotate(180 100 100)"></ellipse>

<ellipse cx="100" cy="46" rx="15" ry="28" transform="rotate(300 100 100)"></ellipse>

<ellipse cx="100" cy="50" rx="12" ry="24" transform="rotate(150 100 100)"></ellipse>
<ellipse cx="100" cy="50" rx="12" ry="24" transform="rotate(210 100 100)"></ellipse>
<ellipse cx="100" cy="50" rx="12" ry="24" transform="rotate(270 100 100)"></ellipse>
<ellipse cx="100" cy="50" rx="12" ry="24" transform="rotate(330 100 100)"></ellipse>
</g>
<circle cx="100" cy="100" r="34" fill="#fff6e8" stroke="#3b3350" stroke-width="4"></circle>
<path d="M100 100 L100 76" stroke="#3b3350" stroke-width="5" stroke-linecap="round"></path>
<path d="M100 100 Q112 106 118 116 Q104 116 100 100 Z" fill="#8fcf9f" stroke="#3b3350" stroke-width="3" stroke-linejoin="round"></path>
<circle cx="100" cy="100" r="4" fill="#3b3350"></circle>
</svg>
<p style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 46px; letter-spacing: -0.01em; color: #3b3350">Chrono<span style="color: #e48aa3">Flore</span></p>
<p style="margin: 0; font-size: 15px; color: #6f6585; text-align: center">Le temps du rêve, en fleur. Lisible en petit, se décline en icône d'app.</p>
</div>

<div style="background: #fffdf8; border-radius: 28px; padding: 40px 32px; display: flex; flex-direction: column; align-items: center; gap: 20px; box-shadow: 0 10px 30px rgba(90, 70, 120, 0.08)">
<p style="margin: 0; align-self: flex-start; font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #6f6585">B · Lune-pousse</p>
<svg width="220" height="220" viewBox="0 0 200 200" role="img" aria-label="Croissant de lune d'où sort une jeune pousse">
<circle cx="100" cy="104" r="78" fill="#e9e4fb"></circle>
<path d="M118 36 A66 66 0 1 0 168 136 A54 54 0 1 1 118 36 Z" fill="#cdc4ef" stroke="#3b3350" stroke-width="4" stroke-linejoin="round"></path>
<path d="M112 150 C112 128 116 112 128 96" fill="none" stroke="#3b3350" stroke-width="5" stroke-linecap="round"></path>
<path d="M126 100 C140 84 160 86 164 94 C152 106 136 108 126 100 Z" fill="#8fcf9f" stroke="#3b3350" stroke-width="3.5" stroke-linejoin="round"></path>
<path d="M118 118 C104 104 86 108 84 116 C96 126 110 126 118 118 Z" fill="#b9e4c4" stroke="#3b3350" stroke-width="3.5" stroke-linejoin="round"></path>
<circle cx="150" cy="56" r="5" fill="#f4b9c8"></circle>
<circle cx="168" cy="78" r="3" fill="#f4b9c8"></circle>
<circle cx="56" cy="50" r="3.5" fill="#f4b9c8"></circle>
</svg>
<p style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 500; font-size: 46px; color: #3b3350">chronoflore</p>
<p style="margin: 0; font-size: 15px; color: #6f6585; text-align: center">La nuit qui fait pousser les pensées. Plus doux, plus mélancolique.</p>
</div>

<div style="background: #fffdf8; border-radius: 28px; padding: 40px 32px; display: flex; flex-direction: column; align-items: center; gap: 20px; box-shadow: 0 10px 30px rgba(90, 70, 120, 0.08)">
<p style="margin: 0; align-self: flex-start; font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #6f6585">C · Bouton au filet</p>
<svg width="220" height="220" viewBox="0 0 200 200" role="img" aria-label="Bouton de fleur rose pris dans un petit filet à papillon">
<path d="M150 150 L184 184" stroke="#c99b6d" stroke-width="10" stroke-linecap="round"></path>
<circle cx="98" cy="98" r="64" fill="#fff6e8" stroke="#3b3350" stroke-width="5"></circle>
<g stroke="#cdc4ef" stroke-width="3">
<path d="M58 48 L58 148"></path><path d="M78 36 L78 160"></path><path d="M98 34 L98 162"></path><path d="M118 36 L118 160"></path><path d="M138 48 L138 148"></path>
<path d="M48 58 L148 58"></path><path d="M36 78 L160 78"></path><path d="M34 98 L162 98"></path><path d="M36 118 L160 118"></path><path d="M48 138 L148 138"></path>
</g>
<path d="M98 132 C74 118 76 86 98 70 C120 86 122 118 98 132 Z" fill="#f4b9c8" stroke="#3b3350" stroke-width="4" stroke-linejoin="round"></path>
<path d="M98 132 C88 116 90 96 98 84" fill="none" stroke="#e48aa3" stroke-width="3" stroke-linecap="round"></path>
<path d="M98 132 Q84 140 78 132 Q88 126 98 132 Z" fill="#8fcf9f" stroke="#3b3350" stroke-width="3" stroke-linejoin="round"></path>
</svg>
<p style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 44px; color: #3b3350">Chrono<span style="color: #8a7cc9">Flore</span></p>
<p style="margin: 0; font-size: 15px; color: #6f6585; text-align: center">Le geste de la chasseuse. Plus arcade, raconte le gameplay.</p>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"ground":{"editor":"color","default":"#f6f1e7","options":["#f6f1e7","#eef3ea","#efeaf7"]},"$preview":{"width":1440,"height":640}}'>
class Component extends DCLogic {
renderVals() {
return { ground: this.props.ground ?? '#f6f1e7' };
}
}
</script>
</body>
</html>
